name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            shellcheck qt6-declarative-dev-tools gettext

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and render tests
        env:
          WPRS_REQUIRE_GPU: "1"
          WPRS_REQUIRE_VIDEO: "1"
        run: cargo test --workspace --locked

      - name: Shell scripts
        run: shellcheck packaging/*.sh scripts/*.sh

      - name: Plasma plugin syntax
        run: |
          for f in integrations/*/metadata.json; do python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"; done
          for f in integrations/*/contents/ui/*.qml; do /usr/lib/qt6/bin/qmlformat "$f" > /dev/null; done

      - name: Translations
        run: scripts/translations.sh check

      - name: End-to-end test (D-Bus + PipeWire + daemon)
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          cargo build --locked -p wprs-pipewire --example probe
          cp target/debug/examples/probe target/debug/probe
          scripts/integration-test.sh target/debug

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gettext

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tarball
        run: scripts/package.sh dist

      - name: Packages carry no build machine data
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          if strings "$RUNNER_TEMP"/wallpaper-rs-*/bin/* | grep -F -e "$HOME" -e "$GITHUB_WORKSPACE"; then exit 1; fi
          tar -tvzf dist/*.tar.gz | awk '{print $2}' | sort -u | grep -qx '0/0'

      - uses: actions/upload-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Fedora package
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Build and install the RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            set -e
            dnf -y -q install rpm-build systemd-rpm-macros >/dev/null
            scripts/rpm.sh dist/wallpaper-rs-*.tar.gz rpm
            test "$(rpm -qp --qf "%{BUILDHOST}" rpm/*.rpm)" = localhost
            dnf -y -q install ./rpm/*.rpm >/dev/null
            rpm -ql wallpaper-rs
            wprs-ctl --version
          '

      - uses: actions/upload-artifact@v5
        with:
          name: wallpaper-rs-fedora-rpm
          path: rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  plasma:
    name: Plasma end-to-end
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Virtual DRM devices
        run: |
          kernel=$(uname -r)
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-modules-extra-$kernel"
          sudo depmod -a
          sudo modprobe vkms
          if ! sudo modprobe vgem; then
            cc=$(grep -oE 'gcc-[0-9]+' /proc/version | head -n 1)
            sudo apt-get install -y -q "linux-headers-$kernel" ${cc:+"$cc"}
            mkdir -p "$RUNNER_TEMP/vgem" && cd "$RUNNER_TEMP/vgem"
            for f in vgem_drv.c vgem_drv.h vgem_fence.c; do
              curl -sSfLO "https://raw.githubusercontent.com/torvalds/linux/v$(cut -d. -f1,2 <<<"$kernel")/drivers/gpu/drm/vgem/$f"
            done
            printf 'obj-m := vgem.o\nvgem-y := vgem_drv.o vgem_fence.o\n' > Kbuild
            make -s -C "/lib/modules/$kernel/build" M="$PWD" CC="${cc:-gcc}" modules
            sudo modprobe drm_shmem_helper
            sudo insmod vgem.ko
          fi
          sudo udevadm settle
          sudo chmod 666 /dev/dri/*
          ls -l /dev/dri

      - name: Run Plasma session test
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed \
              plasma-desktop plasma-workspace kwin kpipewire spectacle \
              pipewire wireplumber dbus gst-plugins-base gst-plugins-good \
              mesa vulkan-swrast vulkan-icd-loader \
              imagemagick tar gzip libcap gdb jq qt6-declarative >/dev/null
            pacman -Q plasma-desktop plasma-workspace kwin kpipewire mesa
            scripts/plasma-test.sh dist/wallpaper-rs-*.tar.gz plasma-test-output
          '

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plasma-test-output
          path: plasma-test-output
          if-no-files-found: warn
          retention-days: 7
