name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conventional Commits and commit dates
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          kept() { grep -vFf <(sed -n 's/^ *- \([0-9a-f]\{40\}\)$/\1/p' GitVersion.yml); }
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=$(git merge-base origin/master HEAD)
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "$BASE")
          bad=$({ git log --no-merges --format='%H %s' "$BASE..HEAD"; [ -z "$TITLE" ] || echo "title $TITLE"; } | kept |
            grep -Ev '^\S+ (build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: \S' || true)
          [ -z "$bad" ] || { echo "$bad"; echo "::error::These subjects do not follow Conventional Commits"; exit 1; }
          newest=$(git log --format='%ct %H' HEAD^@ | kept | sort -n | tail -1)
          [ "$(git log -1 --format=%ct)" -gt "${newest%% *}" ] || { echo "::error::HEAD needs a later commit date than ${newest#* }"; exit 1; }

      - uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f
        with:
          versionSpec: 6.8.2

      - id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f

      - name: GitVersion versioned HEAD
        env:
          SHA: ${{ steps.gitversion.outputs.sha }}
        run: test "$SHA" = "$(git rev-parse HEAD)"

  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire gstreamer1.0-tools \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 gnome-keyring \
            shellcheck qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools gettext

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Unit and render tests
        env:
          WPRS_REQUIRE_GPU: "1"
          WPRS_REQUIRE_VIDEO: "1"
        run: cargo test --workspace --all-features --locked

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.local/share/wallpaper-rs/models
            ~/.local/share/wallpaper-rs/runtime
          key: depth-anything-v2-small-46c4e8ee-onnxruntime-1.31.0

      - name: Depth model test
        run: |
          cargo build --locked -p wprs-ctl
          target/debug/wprs-ctl models download depth-anything-v2-small --yes
          target/debug/wprs-ctl models download onnxruntime --yes
          WPRS_DEPTH_MODEL=$HOME/.local/share/wallpaper-rs/models/depth-anything-v2-small/depth_anything_v2_vits_dynamic.onnx \
            cargo test --locked -p wprs-depth --all-features --test model -- --nocapture

      - name: Shell scripts
        run: shellcheck packaging/*.sh packaging/flatpak/*.sh scripts/*.sh

      - name: QML syntax
        run: |
          for f in integrations/*/metadata.json; do python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"; done
          for f in integrations/*/contents/ui/*.qml apps/wprs-app/qml/*.qml apps/wprs-app/qml/*/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null
          done

      - name: Translations
        run: scripts/translations.sh check

      - name: End-to-end test (D-Bus + PipeWire + daemon)
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          cargo build --locked -p wprs-pipewire --example probe
          cargo build --locked -p wprsd --example timedate
          cp target/debug/examples/probe target/debug/probe
          scripts/integration-test.sh target/debug

  sway:
    name: Sway end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            sway grim foot fonts-dejavu-core

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Layer-shell surfaces on a headless Sway
        run: |
          cargo build --locked -p wprsd -p wprs-ctl --bins --example pointer
          scripts/sway-test.sh target/debug

  x11:
    name: X11 end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            xvfb x11-utils x11-xserver-utils xdotool imagemagick openbox

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Desktop windows on Xvfb
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          scripts/x11-test.sh target/debug

  sync:
    name: Server sync end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 gnome-keyring

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Daemons, the phone client and wprs-server with end-to-end encrypted sync
        run: |
          cargo build --locked -p wprsd -p wprs-ctl -p wprs-server
          cargo build --locked -p wprs-android --example phone
          cp target/debug/examples/phone target/debug/phone
          scripts/sync-test.sh target/debug

  package:
    name: Package
    needs: version
    runs-on: ubuntu-24.04
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ci-apt
          key: apt-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ github.job }}-

      - name: Install system packages
        run: |
          scripts/ci-apt.sh \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gettext \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build tarball
        run: scripts/package.sh dist

      - name: Packages carry no build machine data
        run: |
          tar -xzf "dist/wallpaper-rs-${WPRS_VERSION%%+*}-x86_64-linux.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/wallpaper-rs-${WPRS_VERSION%%+*}-x86_64-linux/bin/wprs-ctl" --version)" = "wprs-ctl $WPRS_VERSION"
          for p in plasma-wallpaper plasma-tray kwin-pointer; do
            grep -qF "\"Version\": \"${WPRS_VERSION%%+*}\"" "$RUNNER_TEMP"/wallpaper-rs-*/$p/metadata.json
          done
          bins=("$RUNNER_TEMP"/wallpaper-rs-*/bin/*)
          if strings "${bins[@]}" | grep -F -e "$HOME" -e "$GITHUB_WORKSPACE" -e "$USER@"; then exit 1; fi
          if strings "${bins[@]}" | grep -E '/(home|root)/'; then exit 1; fi
          if readelf -p .comment "${bins[@]}" 2>/dev/null | grep -q '\['; then exit 1; fi
          tar --numeric-owner -tvzf dist/*.tar.gz | awk '$2 != "0/0" {bad = 1} END {exit bad}'
          python3 -c 'import sys; h = open(sys.argv[1], "rb").read(8); sys.exit(h[3] & 8 or h[4:8] != bytes(4))' dist/*.tar.gz

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: aarch64-linux-android, x86_64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: android

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Clippy for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -P 31 clippy --locked -p wprs-android -- -D warnings

      - name: Release APK and lint
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ needs.version.outputs.semver }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          WPRS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KEYSTORE" ]; then
            base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/wprs.keystore"
            export WPRS_KEYSTORE="$RUNNER_TEMP/wprs.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE is not set, so this APK is signed with a temporary debug key"
          fi
          android/gradlew -p android assembleRelease lintRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: 16 KB page alignment
        run: |
          readelf="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          unzip -q android/app/build/outputs/apk/release/*.apk 'lib/*' -d "$RUNNER_TEMP/apk"
          for abi in arm64-v8a x86_64; do
            test -f "$RUNNER_TEMP/apk/lib/$abi/libwprs_android.so"
            test -f "$RUNNER_TEMP/apk/lib/$abi/libonnxruntime.so"
          done
          for lib in "$RUNNER_TEMP"/apk/lib/*/*.so; do
            aligns=$("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }')
            test -n "$aligns"
            for align in $aligns; do
              (( align >= 0x4000 )) || { echo "::error::$lib has a LOAD segment aligned to $align"; exit 1; }
            done
          done
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          "$tools/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/release/*.apk
          cp android/app/build/outputs/apk/release/*.apk wallpaper-rs-android.apk

      - name: No build paths in the native library
        run: |
          if grep -a -l -F "$HOME/" "$RUNNER_TEMP"/apk/lib/*/libwprs_android.so; then
            echo "::error::the native library keeps paths of the build machine"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: wallpaper-rs-android.apk
          archive: false
          if-no-files-found: error
          retention-days: 7

  android-emulator:
    name: Android emulator tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: android-emulator

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App and test APKs for x86_64
        run: |
          printf 'ANDROID_NDK_HOME=%s\nANDROID_NDK_ROOT=%s\n' "$ANDROID_NDK_LATEST_HOME" "$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          android/gradlew -p android assembleDebug assembleDebugAndroidTest -Pabis=x86_64

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          script: android/gradlew -p android connectedDebugAndroidTest -Pabis=x86_64

      - name: Failing instrumentation tests
        if: failure()
        run: scripts/android-failures.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: failure()
        with:
          name: android-tests-report
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 7

  rpm:
    name: Fedora package
    needs: [version, package]
    runs-on: ubuntu-24.04
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Build and install the RPM without its desktop dependencies
        run: |
          docker run --rm -e WPRS_VERSION -v "$PWD:/src" -w /src fedora:latest bash -c '
            set -e
            dnf -y -q install rpm-build systemd-rpm-macros >/dev/null
            scripts/rpm.sh dist/wallpaper-rs-*.tar.gz rpm
            test "$(rpm -qp --qf "%{BUILDHOST}\n" rpm/*.rpm | sort -u)" = localhost
            own=$(rpm -qp --provides rpm/*.rpm | cut -d" " -f1)
            rpm -qpR rpm/*.rpm | grep -v "^rpmlib(" | sort -u | while read -r dep; do
              grep -qxF "${dep%% *}" <<< "$own" && continue
              dnf -q repoquery --whatprovides "$dep" | grep -q . || { echo "nothing provides $dep"; exit 1; }
            done
            rpm -i --nodeps rpm/*.rpm
            rpm -ql wallpaper-rs
            test "$(wprs-ctl --version)" = "wprs-ctl $WPRS_VERSION"
          '

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wallpaper-rs-fedora-rpm
          path: rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            bundle: wallpaper-rs.flatpak
          - arch: aarch64
            runner: ubuntu-24.04-arm
            bundle: wallpaper-rs-aarch64.flatpak
    runs-on: ${{ matrix.runner }}
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
      BUNDLE: ${{ matrix.bundle }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11@sha256:b0a8a2acb9e420dd0e3e083ff552bea5a817e17e41532f1d2287ff49ef9aae0e
      options: --privileged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Tracked sources, vendored Cargo sources and version
        run: packaging/flatpak/sources.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: packaging/flatpak/io.github.wallpaper_rs.WallpaperRs.yml
          bundle: ${{ matrix.bundle }}
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}
          upload-artifact: false

      - name: Install and run the bundle
        run: packaging/flatpak/check.sh "$BUNDLE"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: wallpaper-rs-flatpak-${{ matrix.arch }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 7

  plasma:
    name: Plasma end-to-end
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Virtual DRM devices
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci-drm.sh

      - name: Run Plasma session test
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed \
              plasma-desktop plasma-workspace kwin kpipewire spectacle \
              pipewire wireplumber dbus gst-plugins-base gst-plugins-good \
              mesa vulkan-swrast vulkan-icd-loader \
              imagemagick tar gzip libcap gdb jq qt6-declarative kirigami qqc2-desktop-style >/dev/null
            pacman -Q plasma-desktop plasma-workspace kwin kpipewire mesa kirigami
            mkdir -p /tmp/app && tar -xzf dist/wallpaper-rs-*.tar.gz -C /tmp/app
            /tmp/app/wallpaper-rs-*/bin/wprs-app --check
            scripts/plasma-test.sh dist/wallpaper-rs-*.tar.gz plasma-test-output
          '

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        if: always()
        with:
          name: plasma-test-output
          path: plasma-test-output
          if-no-files-found: warn
          retention-days: 7

  server:
    name: Server container
    needs: version
    runs-on: ubuntu-24.04
    env:
      WPRS_VERSION: ${{ needs.version.outputs.informational }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Build and start with compose
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Health, setup, repository, backup and restore
        run: scripts/server-smoke.sh

      - name: Server logs
        if: always()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [version, check, sway, x11, sync, package, android, android-emulator, rpm, flatpak, plasma, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wallpaper-rs-*
          path: artifacts
          merge-multiple: true

      - name: Publish the version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.semver }}
        run: scripts/release.sh artifacts
