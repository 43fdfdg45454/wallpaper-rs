name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            shellcheck qt6-declarative-dev-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and render tests
        env:
          WPRS_REQUIRE_GPU: "1"
        run: cargo test --workspace --locked

      - name: Shell scripts
        run: shellcheck packaging/*.sh scripts/*.sh

      - name: Plasma plugin syntax
        run: |
          python3 -c "import json; json.load(open('integrations/plasma-wallpaper/metadata.json'))"
          for f in integrations/plasma-wallpaper/contents/ui/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null
          done

      - name: End-to-end test (D-Bus + PipeWire + daemon)
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          cargo build --locked -p wprs-pipewire --example probe
          cp target/debug/examples/probe target/debug/probe
          scripts/integration-test.sh target/debug

  package:
    name: Package
    needs: check
    # Ubuntu 24.04 is the oldest base with PipeWire >= 1.0 headers, which the
    # bindings need. Its glibc 2.39 keeps the binaries portable to current
    # distributions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tarball
        run: scripts/package.sh dist

      - uses: actions/upload-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  plasma:
    name: Plasma end-to-end
    needs: package
    runs-on: ubuntu-24.04
    # Released Plasma 6 in a disposable container: installs the release
    # tarball, runs plasmashell on a virtual X server and checks a screenshot.
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install Plasma
        run: |
          pacman -Syu --noconfirm --needed \
            plasma-desktop plasma-workspace kpipewire xorg-server-xvfb \
            pipewire wireplumber dbus \
            mesa vulkan-swrast vulkan-icd-loader \
            imagemagick tar gzip gdb
          pacman -Q plasma-desktop plasma-workspace kpipewire

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      - name: Run Plasma session test
        run: scripts/plasma-test.sh dist/wallpaper-rs-*.tar.gz plasma-test-output

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plasma-test-output
          path: plasma-test-output
          if-no-files-found: warn
