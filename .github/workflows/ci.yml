name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            mesa-vulkan-drivers libvulkan1 \
            pipewire pipewire-bin wireplumber dbus-x11 \
            shellcheck qt6-declarative-dev-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and render tests
        env:
          WPRS_REQUIRE_GPU: "1"
          WPRS_REQUIRE_VIDEO: "1"
        run: cargo test --workspace --locked

      - name: Shell scripts
        run: shellcheck packaging/*.sh scripts/*.sh

      - name: Plasma plugin syntax
        run: |
          python3 -c "import json; json.load(open('integrations/plasma-wallpaper/metadata.json'))"
          for f in integrations/plasma-wallpaper/contents/ui/*.qml; do
            /usr/lib/qt6/bin/qmlformat "$f" > /dev/null
          done

      - name: End-to-end test (D-Bus + PipeWire + daemon)
        run: |
          cargo build --locked -p wprsd -p wprs-ctl
          cargo build --locked -p wprs-pipewire --example probe
          cp target/debug/examples/probe target/debug/probe
          scripts/integration-test.sh target/debug

  package:
    name: Package
    # Ubuntu 24.04 is the oldest base with PipeWire >= 1.0 headers, which the
    # bindings need. Its glibc 2.39 keeps the binaries portable to current
    # distributions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libpipewire-0.3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build tarball
        run: scripts/package.sh dist

      - uses: actions/upload-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  plasma:
    name: Plasma end-to-end
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: wallpaper-rs-x86_64-linux
          path: dist

      # KWin needs a DRM device. vgem provides a render node and vkms a
      # virtual monitor, both without a GPU.
      - name: Virtual DRM devices
        run: |
          # Some runner kernels ship these modules only in the extra package.
          if ! modinfo vgem >/dev/null 2>&1 || ! modinfo vkms >/dev/null 2>&1; then
            sudo apt-get update -q
            sudo apt-get install -y -q "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe vgem
          sudo modprobe vkms
          sudo chmod 666 /dev/dri/*
          ls -l /dev/dri

      # Released Plasma 6 in a disposable container with the DRM devices:
      # installs the release tarball, runs a headless KWin Wayland session
      # with plasmashell and checks a screenshot.
      - name: Run Plasma session test
        run: |
          docker run --rm --device /dev/dri -v "$PWD:/src" -w /src archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed \
              plasma-desktop plasma-workspace kwin kpipewire spectacle \
              pipewire wireplumber dbus gst-plugins-base gst-plugins-good \
              mesa vulkan-swrast vulkan-icd-loader \
              imagemagick tar gzip libcap gdb >/dev/null
            pacman -Q plasma-desktop plasma-workspace kwin kpipewire mesa
            scripts/plasma-test.sh dist/wallpaper-rs-*.tar.gz plasma-test-output
          '

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plasma-test-output
          path: plasma-test-output
          if-no-files-found: warn
