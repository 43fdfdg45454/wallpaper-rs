name: Render node probe

# Checks whether the runner kernel can provide a virtual DRM render node,
# which KWin needs to run a headless Wayland session for the Plasma test.
on:
  push:
    paths: [".github/workflows/render-node-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Kernel modules
        run: |
          uname -r
          find /lib/modules/"$(uname -r)" -name 'vgem*' -o -name 'vkms*' | sed 's|.*/||' || true
          ls -l /dev/dri 2>&1 || true
      - name: Load vgem and vkms
        run: |
          sudo modprobe vgem && echo "vgem loaded" || echo "vgem unavailable"
          sudo modprobe vkms && echo "vkms loaded" || echo "vkms unavailable"
          ls -l /dev/dri 2>&1 || true
          for d in /sys/class/drm/*; do echo "$d -> $(cat "$d"/device/uevent 2>/dev/null | grep DRIVER)"; done
