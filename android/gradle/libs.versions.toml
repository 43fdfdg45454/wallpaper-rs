[versions]
agp = "9.4.1"
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
media3 = "1.11.1"
work = "2.12.0"
webkit = "1.14.0"
test-runner = "1.7.0"
test-junit = "1.3.0"
junit = "4.13.2"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-core" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
