[package]
name = "wprs-server"
description = "Self-hosted server of wallpaper-rs: signed package repository, catalog, uploads with moderation and device sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
oidc = ["dep:openidconnect", "dep:reqwest"]

[dependencies]
wprs-format = { workspace = true, features = ["sign"] }
wprs-scene.workspace = true
anyhow.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
getrandom.workspace = true
image.workspace = true
maud.workspace = true
mdns-sd.workspace = true
openidconnect = { workspace = true, optional = true }
percent-encoding.workspace = true
rcgen.workspace = true
reqwest = { workspace = true, optional = true }
rusqlite.workspace = true
rustix = { workspace = true, features = ["process"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "fs", "io-util", "process"] }
tokio-rustls = { workspace = true, features = ["aws-lc-rs"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["form", "multipart"] }
wiremock.workspace = true
wprs-sync.workspace = true
