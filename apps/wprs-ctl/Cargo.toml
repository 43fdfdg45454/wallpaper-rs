[package]
name = "wprs-ctl"
description = "Command line control for the wallpaper-rs daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wprs-core.workspace = true
wprs-client.workspace = true
wprs-format = { workspace = true, features = ["sign"] }
wprs-providers.workspace = true
wprs-sync.workspace = true
wprs-render = { workspace = true, features = ["avif"] }
wprs-depth = { workspace = true, features = ["fetch", "infer"] }
wprs-scene.workspace = true
wprs-editor.workspace = true
anyhow.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
futures-util.workspace = true
image.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
