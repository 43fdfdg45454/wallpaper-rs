[workspace]
resolver = "3"
members = [
    "crates/wprs-core",
    "crates/wprs-render",
    "crates/wprs-pipewire",
    "crates/wprs-video",
    "crates/wprs-format",
    "crates/wprs-schedule",
    "crates/wprs-providers",
    "crates/wprs-scene",
    "crates/wprs-library",
    "crates/wprs-client",
    "apps/wprsd",
    "apps/wprs-ctl",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
repository = "https://github.com/43fdfdg45454/wallpaper-rs"

[workspace.dependencies]
wprs-core = { path = "crates/wprs-core" }
wprs-render = { path = "crates/wprs-render" }
wprs-pipewire = { path = "crates/wprs-pipewire" }
wprs-video = { path = "crates/wprs-video" }
wprs-format = { path = "crates/wprs-format" }
wprs-schedule = { path = "crates/wprs-schedule" }
wprs-providers = { path = "crates/wprs-providers" }
wprs-scene = { path = "crates/wprs-scene" }
wprs-library = { path = "crates/wprs-library" }
wprs-client = { path = "crates/wprs-client" }
anyhow = "1"
thiserror = "2"
rustix = { version = "1", features = ["fs", "mm"] }
futures-util = { version = "0.3", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
ulid = "3"
base64 = "0.23"
minisign-verify = "0.3"
minisign = "0.10"
semver = "1"
tempfile = "3"
chrono = { version = "0.4.41", default-features = false, features = ["std", "serde"] }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
roxmltree = "0.21"
percent-encoding = "2"
wiremock = "0.6"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service", "proxy"] }
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
pipewire = { version = "0.10", features = ["v0_3_65"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package.scrypt]
opt-level = 3
